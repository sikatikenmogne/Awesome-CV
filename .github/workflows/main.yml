name: Compile Custom CVs

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Enhanced LaTeX Setup
      run: |
        echo "=== INSTALLATION PACKAGES LaTeX ==="
        apt-get update
        apt-get install -y \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          texlive-latex-recommended \
          texlive-luatex \
          fonts-font-awesome \
          fontconfig \
          python3-pip \
          file
        
        # Refresh font cache
        fc-cache -fv
        
        echo "LaTeX version:"
        xelatex --version

    - name: Verify Custom Files
      run: |
        echo "=== VERIFICATION FICHIERS CUSTOM ==="
        
        # Check for custom CV files
        CUSTOM_FILES=(
          "custom/en/resume-en.tex"
          "custom/fr/resume-fr.tex" 
          "custom/fr/cv-fr.tex"
          "awesome-cv.cls"
        )
        
        for file in "${CUSTOM_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "OK: $file exists ($(stat -c%s "$file") bytes)"
          else
            echo "WARNING: $file missing"
          fi
        done
        
        # Show structure of custom directories
        echo "=== STRUCTURE CUSTOM DIRECTORIES ==="
        find custom/ -name "*.tex" | head -20

    - name: Prepare Output Directories
      run: |
        echo "=== PREPARATION REPERTOIRES SORTIE ==="
        mkdir -p custom/output/en
        mkdir -p custom/output/fr
        echo "Created custom output directories"

    - name: Compile Custom English CV
      run: |
        echo "=== COMPILATION CV ANGLAIS ==="
        cd custom/en
        
        # Try to compile resume-en.tex
        if [ -f "resume-en.tex" ]; then
          echo "Compiling resume-en.tex..."
          xelatex -interaction=nonstopmode -output-directory=../output/en resume-en.tex
          
          # Run twice for references
          xelatex -interaction=nonstopmode -output-directory=../output/en resume-en.tex
          
          if [ -f "../output/en/resume-en.pdf" ]; then
            size=$(stat -c%s "../output/en/resume-en.pdf")
            echo "SUCCESS: English CV generated (${size} bytes)"
          else
            echo "ERROR: Failed to generate English CV"
            # Show log if exists
            if [ -f "../output/en/resume-en.log" ]; then
              echo "=== LAST 50 LINES OF LOG ==="
              tail -50 "../output/en/resume-en.log"
            fi
          fi
        else
          echo "WARNING: resume-en.tex not found"
        fi

    - name: Compile Custom French CV
      run: |
        echo "=== COMPILATION CV FRANCAIS ==="
        cd custom/fr
        
        # Try to compile resume-fr.tex
        if [ -f "resume-fr.tex" ]; then
          echo "Compiling resume-fr.tex..."
          xelatex -interaction=nonstopmode -output-directory=../output/fr resume-fr.tex
          xelatex -interaction=nonstopmode -output-directory=../output/fr resume-fr.tex
          
          if [ -f "../output/fr/resume-fr.pdf" ]; then
            size=$(stat -c%s "../output/fr/resume-fr.pdf")
            echo "SUCCESS: French CV generated (${size} bytes)"
          else
            echo "ERROR: Failed to generate French CV"
            if [ -f "../output/fr/resume-fr.log" ]; then
              echo "=== LAST 50 LINES OF LOG ==="
              tail -50 "../output/fr/resume-fr.log"
            fi
          fi
        else
          echo "WARNING: resume-fr.tex not found"
        fi
        
        # Try to compile cv-fr.tex if it exists
        if [ -f "cv-fr.tex" ]; then
          echo "Compiling cv-fr.tex..."
          xelatex -interaction=nonstopmode -output-directory=../output/fr cv-fr.tex
          xelatex -interaction=nonstopmode -output-directory=../output/fr cv-fr.tex
          
          if [ -f "../output/fr/cv-fr.pdf" ]; then
            size=$(stat -c%s "../output/fr/cv-fr.pdf")
            echo "SUCCESS: French CV (cv-fr.tex) generated (${size} bytes)"
          fi
        fi

    - name: Check Generated PDFs
      run: |
        echo "=== VERIFICATION PDFS GENERES ==="
        
        echo "English PDFs:"
        ls -la custom/output/en/*.pdf 2>/dev/null || echo "No English PDFs generated"
        
        echo "French PDFs:"
        ls -la custom/output/fr/*.pdf 2>/dev/null || echo "No French PDFs generated"
        
        echo "All custom PDFs found:"
        find custom/output/ -name "*.pdf" -type f | while read pdf; do
          size=$(stat -c%s "$pdf")
          echo "  $pdf (${size} bytes)"
        done

    - name: Analyze Compilation Errors
      if: always()
      run: |
        echo "=== ANALYSE ERREURS COMPILATION ==="
        
        # Check English logs
        if [ -f "custom/output/en/resume-en.log" ]; then
          echo "=== LOG ANGLAIS ==="
          tail -50 "custom/output/en/resume-en.log"
          
          # Look for specific errors
          if grep -q "Undefined control sequence" "custom/output/en/resume-en.log"; then
            echo "ERROR: Undefined control sequence in English CV"
            grep -A2 "Undefined control sequence" "custom/output/en/resume-en.log"
          fi
          
          if grep -q "File.*not found" "custom/output/en/resume-en.log"; then
            echo "ERROR: Missing files in English CV"
            grep "File.*not found" "custom/output/en/resume-en.log"
          fi
        fi
        
        # Check French logs
        for log_file in "custom/output/fr/resume-fr.log" "custom/output/fr/cv-fr.log"; do
          if [ -f "$log_file" ]; then
            echo "=== LOG FRANCAIS: $(basename "$log_file") ==="
            tail -50 "$log_file"
            
            if grep -q "Undefined control sequence" "$log_file"; then
              echo "ERROR: Undefined control sequence in French CV"
              grep -A2 "Undefined control sequence" "$log_file"
            fi
            
            if grep -q "File.*not found" "$log_file"; then
              echo "ERROR: Missing files in French CV"
              grep "File.*not found" "$log_file"
            fi
          fi
        done

    - name: Upload Custom PDFs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: custom-cv-pdfs
        path: |
          custom/output/**/*.pdf
        retention-days: 30

    - name: Upload Compilation Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: custom-compilation-logs
        path: |
          custom/output/**/*.log
          custom/output/**/*.aux
        retention-days: 7

    - name: Build Summary
      if: always()
      run: |
        echo "=== RESUME COMPILATION CUSTOM CVs ==="
        
        # Count generated PDFs
        PDF_COUNT=0
        EN_PDFS=0
        FR_PDFS=0
        
        if ls custom/output/en/*.pdf 1> /dev/null 2>&1; then
          EN_PDFS=$(ls custom/output/en/*.pdf | wc -l)
          PDF_COUNT=$((PDF_COUNT + EN_PDFS))
        fi
        
        if ls custom/output/fr/*.pdf 1> /dev/null 2>&1; then
          FR_PDFS=$(ls custom/output/fr/*.pdf | wc -l)  
          PDF_COUNT=$((PDF_COUNT + FR_PDFS))
        fi
        
        echo "Total PDFs generated: $PDF_COUNT"
        echo "English PDFs: $EN_PDFS"
        echo "French PDFs: $FR_PDFS"
        
        # Create GitHub summary
        echo "## Custom CV Compilation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Total PDFs Generated:** $PDF_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "**English CVs:** $EN_PDFS" >> $GITHUB_STEP_SUMMARY  
        echo "**French CVs:** $FR_PDFS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$PDF_COUNT" -gt 0 ]; then
          echo "**Status:** SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated Files:**" >> $GITHUB_STEP_SUMMARY
          
          find custom/output/ -name "*.pdf" -type f | while read pdf; do
            size=$(stat -c%s "$pdf")
            echo "- \`$pdf\` (${size} bytes)" >> $GITHUB_STEP_SUMMARY
          done
        else
          echo "**Status:** FAILED - No PDFs generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the 'custom-compilation-logs' artifact for details." >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`custom-cv-pdfs\`: Generated PDF files" >> $GITHUB_STEP_SUMMARY
        echo "- \`custom-compilation-logs\`: LaTeX compilation logs" >> $GITHUB_STEP_SUMMARY