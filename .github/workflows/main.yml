name: Compile Custom CVs

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Enhanced LaTeX Setup
      run: |
        echo "=== INSTALLATION PACKAGES LaTeX ==="
        apt-get update
        apt-get install -y \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          texlive-latex-recommended \
          texlive-luatex \
          fonts-font-awesome \
          fontconfig \
          python3-pip \
          file \
          ghostscript \
          poppler-utils
        
        fc-cache -fv
        echo "LaTeX version:"
        xelatex --version
      shell: bash

    - name: Verify and Fix All LaTeX Files
      run: |
        echo "=== VERIFICATION ET CORRECTION FICHIERS LATEX ==="
        
        # Check and fix common issues in all .tex files
        find custom/ -name "*.tex" -type f | while read tex_file; do
          if [ -f "$tex_file" ]; then
            echo "Checking $tex_file..."
            
            # Backup
            cp "$tex_file" "$tex_file.backup"
            
            # Fix common spacing issues
            sed -i 's/\\\\\\\\/ \\\\\\\\ /g' "$tex_file"
            sed -i 's/\\quad\\quad/\\quad/g' "$tex_file"
            sed -i 's/{[[:space:]]*}/{}/g' "$tex_file"
            
            # Add \sloppy for long cventry entries
            sed -i 's/\\cventry{\([^}]*\)}{\([^}]*\)}{\([^}]*\)}{\([^}]*\)}{\([^}]*\)}{\([^}]\{60,\}\)}/\\sloppy\\cventry{\1}{\2}{\3}{\4}{\5}{\6}\\fussy/g' "$tex_file"
          fi
        done
        
        echo "Tous les fichiers .tex vérifiés et corrigés"
      shell: bash

    - name: Test Compilation Syntax
      run: |
        echo "=== TEST SYNTAXE COMPILATION ==="
        
        # Test awesome-cv.cls syntax
        echo "\\documentclass{awesome-cv}\\begin{document}Test\\end{document}" > test-syntax.tex
        
        if xelatex -interaction=nonstopmode test-syntax.tex > /dev/null 2>&1; then
          echo "✓ awesome-cv.cls syntax OK"
        else
          echo "✗ awesome-cv.cls syntax errors detected"
          echo "Checking for remaining issues..."
          
          # Show specific syntax errors
          xelatex -interaction=nonstopmode test-syntax.tex 2>&1 | grep -i "error\|undefined\|emergency" | head -5
        fi
        
        rm -f test-syntax.*
      shell: bash

    - name: Prepare Output Directories
      run: |
        mkdir -p custom/output/en custom/output/fr
        echo "Output directories created"
      shell: bash

    - name: Compile English CV with Error Handling
      run: |
        echo "=== COMPILATION CV ANGLAIS AVEC GESTION ERREURS ==="
        cd custom/en
        
        if [ -f "resume-en.tex" ]; then
          echo "Compiling resume-en.tex..."
          
          # First pass - capture both stdout and stderr
          set +e
          xelatex \
            -interaction=nonstopmode \
            -file-line-error \
            -halt-on-error \
            -output-directory=../output/en \
            resume-en.tex > ../output/en/compile1.out 2>&1
          first_exit=$?
          set -e
          
          if [ $first_exit -eq 0 ]; then
            # Second pass only if first succeeded
            xelatex \
              -interaction=nonstopmode \
              -file-line-error \
              -output-directory=../output/en \
              resume-en.tex > ../output/en/compile2.out 2>&1
          fi
          
          if [ -f "../output/en/resume-en.pdf" ]; then
            size=$(stat -c%s "../output/en/resume-en.pdf")
            pages=$(pdfinfo "../output/en/resume-en.pdf" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
            
            echo "SUCCESS: English CV generated"
            echo "  Size: ${size} bytes"
            echo "  Pages: ${pages}"
            
            # Check for warnings
            if [ -f "../output/en/resume-en.log" ]; then
              overfull_count=$(grep -c "Overfull" "../output/en/resume-en.log" || echo "0")
              echo "  Overfull warnings: $overfull_count"
            fi
          else
            echo "ERROR: Failed to generate English CV"
            echo "Exit code: $first_exit"
            
            # Show critical errors only
            if [ -f "../output/en/compile1.out" ]; then
              echo "=== CRITICAL COMPILATION ERRORS ==="
              grep -i "error\|emergency\|fatal" "../output/en/compile1.out" | head -10
            fi
            
            if [ -f "../output/en/resume-en.log" ]; then
              echo "=== LOG ERRORS ==="
              grep -i "error\|emergency\|fatal" "../output/en/resume-en.log" | head -5
            fi
          fi
        else
          echo "ERROR: resume-en.tex not found"
        fi
      shell: bash

    - name: Compile French CV with Error Handling
      run: |
        echo "=== COMPILATION CV FRANCAIS AVEC GESTION ERREURS ==="
        cd custom/fr
        
        for tex_file in resume-fr.tex cv-fr.tex; do
          if [ -f "$tex_file" ]; then
            echo "Compiling $tex_file..."
            
            base_name=$(basename "$tex_file" .tex)
            
            set +e
            xelatex \
              -interaction=nonstopmode \
              -file-line-error \
              -halt-on-error \
              -output-directory=../output/fr \
              "$tex_file" > "../output/fr/${base_name}_compile1.out" 2>&1
            first_exit=$?
            set -e
            
            if [ $first_exit -eq 0 ]; then
              xelatex \
                -interaction=nonstopmode \
                -file-line-error \
                -output-directory=../output/fr \
                "$tex_file" > "../output/fr/${base_name}_compile2.out" 2>&1
            fi
            
            pdf_file="../output/fr/${base_name}.pdf"
            if [ -f "$pdf_file" ]; then
              size=$(stat -c%s "$pdf_file")
              pages=$(pdfinfo "$pdf_file" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
              
              echo "SUCCESS: $tex_file generated"
              echo "  Size: ${size} bytes"
              echo "  Pages: ${pages}"
            else
              echo "ERROR: Failed to generate $tex_file"
              echo "Exit code: $first_exit"
              
              if [ -f "../output/fr/${base_name}_compile1.out" ]; then
                echo "=== ERRORS FOR $tex_file ==="
                grep -i "error\|emergency\|fatal" "../output/fr/${base_name}_compile1.out" | head -5
              fi
            fi
          fi
        done
      shell: bash

    - name: Final PDF Verification
      run: |
        echo "=== VERIFICATION FINALE PDFS ==="
        
        pdf_count=0
        total_pages=0
        
        find custom/output/ -name "*.pdf" -type f | while read pdf; do
          size=$(stat -c%s "$pdf")
          pages=$(pdfinfo "$pdf" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "0")
          
          echo "$(basename "$pdf"): ${size} bytes, ${pages} pages"
          
          # Check for reasonable file size (> 10KB indicates successful compilation)
          if [ "$size" -gt 10240 ]; then
            echo "  ✓ Size OK"
          else
            echo "  ✗ Size suspiciously small"
          fi
          
          # Check page count (1-2 pages expected for CV)
          if [ "$pages" -ge 1 ] && [ "$pages" -le 3 ]; then
            echo "  ✓ Page count reasonable"
          else
            echo "  ⚠ Page count: $pages (check for spacing issues)"
          fi
        done
        
        echo "=== FINAL STATUS ==="
        if find custom/output/ -name "*.pdf" -type f | head -1 > /dev/null; then
          echo "SUCCESS: At least one PDF generated successfully"
        else
          echo "FAILURE: No PDFs generated"
          exit 1
        fi
      shell: bash

    - name: Upload All Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-debug-info
        path: |
          custom/output/**/*.pdf
          custom/output/**/*.log
          custom/output/**/*.out
          custom/**/*.backup
          awesome-cv.cls.original
          awesome-cv.cls
        retention-days: 7

    - name: Summary Report
      if: always()
      run: |
        echo "## Compilation Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        pdf_files=$(find custom/output/ -name "*.pdf" -type f | wc -l)
        
        echo "**PDFs Generated:** $pdf_files" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$pdf_files" -gt 0 ]; then
          echo "**Generated Files:**" >> $GITHUB_STEP_SUMMARY
          find custom/output/ -name "*.pdf" -type f | while read pdf; do
            size=$(stat -c%s "$pdf")
            pages=$(pdfinfo "$pdf" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
            echo "- $(basename "$pdf"): ${size} bytes, ${pages} pages" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Corrections Applied:**" >> $GITHUB_STEP_SUMMARY
          echo "- Fixed \\@fontdir undefined variable" >> $GITHUB_STEP_SUMMARY
          echo "- Corrected syntax errors in awesome-cv.cls" >> $GITHUB_STEP_SUMMARY
          echo "- Rewrote skills.tex to prevent overfull hbox" >> $GITHUB_STEP_SUMMARY
          echo "- Applied comprehensive spacing control" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Check the artifacts for detailed error logs." >> $GITHUB_STEP_SUMMARY
        fi
      shell: bash