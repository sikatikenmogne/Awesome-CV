name: Compile PDFs

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Enhanced LaTeX Setup
      run: |
        echo "=== INSTALLATION PACKAGES LaTeX SUPPLEMENTAIRES ==="
        apt-get update
        apt-get install -y \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          texlive-latex-recommended \
          texlive-luatex \
          fonts-font-awesome \
          fontconfig \
          python3-pip \
          file
        
        # Refresh font cache
        fc-cache -fv
        
        echo "LaTeX version:"
        xelatex --version
        echo "Python version:"
        python3 --version

    - name: Verify Repository Structure and Files
      run: |
        echo "=== VERIFICATION STRUCTURE REPOSITORY ==="
        
        # Show complete directory structure
        echo "Structure complète du repository:"
        find . -type f -name "*.tex" -o -name "*.py" -o -name "*.cls" -o -name "*.sty" -o -name "*.json" | sort
        
        # Check for required files
        REQUIRED_FILES=("cv.py")
        MISSING_FILES=()
        
        for file in "${REQUIRED_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "OK: $file existe ($(stat -c%s "$file") bytes)"
          else
            echo "ERREUR: $file manquant"
            MISSING_FILES+=("$file")
          fi
        done
        
        # Check for .tex files
        echo "=== VERIFICATION FICHIERS TEX ==="
        TEX_FILES=(custom/fr/resume-fr.tex custom/en/resume-en.tex)
        
        for tex_file in "${TEX_FILES[@]}"; do
          if [ -f "$tex_file" ]; then
            echo "OK: $tex_file trouvé ($(stat -c%s "$tex_file") bytes)"
            echo "--- Début du fichier $tex_file ---"
            head -20 "$tex_file"
            echo "--- Fin extrait ---"
          else
            echo "ATTENTION: $tex_file manquant"
          fi
        done
        
        # Check for awesome-cv template
        echo "=== VERIFICATION TEMPLATE AWESOME-CV ==="
        if [ -f "awesome-cv.cls" ]; then
          echo "OK: awesome-cv.cls trouvé à la racine"
        elif find . -name "awesome-cv.cls" -type f | head -1; then
          echo "OK: awesome-cv.cls trouvé dans le repository"
          find . -name "awesome-cv.cls" -type f
        else
          echo "ATTENTION: awesome-cv.cls non trouvé"
        fi
        
        # Show cv.py content if exists
        if [ -f "cv.py" ]; then
          echo "=== CONTENU cv.py (premiers 30 lignes) ==="
          head -30 cv.py
          echo "=== FIN EXTRAIT cv.py ==="
        fi

    - name: Prepare Output Directories
      run: |
        echo "=== PREPARATION REPERTOIRES SORTIE ==="
        
        # Create output directories that cv.py might expect
        mkdir -p examples
        mkdir -p custom/output/fr
        mkdir -p custom/output/en
        mkdir -p outputs
        
        echo "Répertoires créés:"
        ls -la examples/ || echo "examples/ non créé"
        ls -la custom/output/ || echo "custom/output/ non créé"
        ls -la outputs/ || echo "outputs/ non créé"

    - name: Test cv.py Script
      run: |
        echo "=== TEST SCRIPT cv.py ==="
        
        # Test if cv.py has help or check command
        echo "Test des commandes disponibles:"
        python3 cv.py --help || echo "Pas d'aide disponible"
        python3 cv.py help || echo "Pas de commande help"
        python3 cv.py check || echo "Pas de commande check"
        
        # Show what cv.py does when called without arguments
        echo "Test cv.py sans arguments:"
        python3 cv.py || echo "Erreur sans arguments (normal)"

    - name: Enhanced Compilation with Detailed Debugging
      run: |
        echo "=== COMPILATION AVEC DEBUG DETAILLE ==="
        
        # Run the compilation with error capture
        echo "Lancement de la compilation..."
        set +e  # Don't exit on error
        python3 cv.py build all 2>&1 | tee compilation_output.log
        COMPILE_EXIT_CODE=$?
        set -e  # Re-enable exit on error
        
        echo "Code de retour: $COMPILE_EXIT_CODE"
        
        # Look for generated files in various possible locations
        echo "=== RECHERCHE FICHIERS GENERES ==="
        
        # Search for PDF files
        echo "Recherche PDFs générés:"
        find . -name "*.pdf" -type f 2>/dev/null | while read pdf_file; do
          size=$(stat -c%s "$pdf_file")
          echo "PDF trouvé: $pdf_file (${size} bytes)"
        done || echo "Aucun PDF trouvé"
        
        # Search for log files
        echo "Recherche logs LaTeX:"
        find . -name "*.log" -type f 2>/dev/null | while read log_file; do
          size=$(stat -c%s "$log_file")
          echo "LOG trouvé: $log_file (${size} bytes)"
        done || echo "Aucun log trouvé"
        
        # Search for aux files (indicates LaTeX was attempted)
        echo "Recherche fichiers auxiliaires LaTeX:"
        find . -name "*.aux" -type f 2>/dev/null | while read aux_file; do
          echo "AUX trouvé: $aux_file"
        done || echo "Aucun fichier aux trouvé"

    - name: Analyze LaTeX Compilation Errors
      if: always()
      run: |
        echo "=== ANALYSE DETAILLEE DES ERREURS LaTeX ==="
        
        # Find and analyze all .log files
        find . -name "*.log" -type f | while read log_file; do
          echo "=== ANALYSE: $log_file ==="
          
          if [ -f "$log_file" ]; then
            file_size=$(stat -c%s "$log_file")
            echo "Taille du log: $file_size bytes"
            
            # Show last 100 lines of the log
            echo "--- Dernières 100 lignes ---"
            tail -100 "$log_file"
            echo "--- Fin du log ---"
            
            # Look for specific errors
            echo "--- Recherche d'erreurs spécifiques ---"
            
            # Critical errors
            if grep -i "emergency stop\|fatal error\|job aborted" "$log_file"; then
              echo "ERREUR CRITIQUE détectée dans $log_file"
            fi
            
            # File not found errors
            if grep -i "file.*not found\|can't find file" "$log_file"; then
              echo "FICHIERS MANQUANTS détectés:"
              grep -i "file.*not found\|can't find file" "$log_file"
            fi
            
            # Package errors
            if grep -i "package.*error\|unknown package" "$log_file"; then
              echo "ERREURS DE PACKAGES détectées:"
              grep -i "package.*error\|unknown package" "$log_file"
            fi
            
            # Undefined commands
            if grep -i "undefined control sequence" "$log_file"; then
              echo "COMMANDES NON DEFINIES détectées:"
              grep -i -A2 "undefined control sequence" "$log_file"
            fi
            
            # Font errors
            if grep -i "font.*not found\|font.*error" "$log_file"; then
              echo "ERREURS DE POLICES détectées:"
              grep -i "font.*not found\|font.*error" "$log_file"
            fi
            
          else
            echo "Log file $log_file not accessible"
          fi
          
          echo "=========================="
        done

    - name: Show Working Directory Contents
      if: always()
      run: |
        echo "=== CONTENU FINAL REPERTOIRES ==="
        
        echo "Contenu examples/:"
        ls -la examples/ || echo "examples/ vide ou inexistant"
        
        echo "Contenu custom/:"
        find custom/ -type f 2>/dev/null | head -20 || echo "custom/ vide ou inexistant"
        
        echo "Contenu racine (fichiers PDF):"
        ls -la *.pdf 2>/dev/null || echo "Aucun PDF à la racine"
        
        echo "Tous les PDFs dans le repository:"
        find . -name "*.pdf" -type f | head -10 || echo "Aucun PDF trouvé"

    - name: Upload Compilation Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compilation-logs-debug
        path: |
          **/*.log
          compilation_output.log
          **/*.aux
          **/*.fls
          **/*.fdb_latexmk
        retention-days: 7

    - name: Upload Generated PDFs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: generated-pdfs
        path: |
          examples/*.pdf
          **/*.pdf
        retention-days: 30

    - name: Final Summary
      if: always()
      run: |
        echo "=== RESUME FINAL ==="
        
        # Count PDFs found
        PDF_COUNT=$(find . -name "*.pdf" -type f | wc -l)
        LOG_COUNT=$(find . -name "*.log" -type f | wc -l)
        
        echo "PDFs générés: $PDF_COUNT"
        echo "Logs LaTeX générés: $LOG_COUNT"
        
        if [ "$PDF_COUNT" -gt 0 ]; then
          echo "SUCCESS: Au moins un PDF a été généré"
          find . -name "*.pdf" -type f | while read pdf; do
            size=$(stat -c%s "$pdf")
            echo "  - $pdf (${size} bytes)"
          done
        else
          echo "ECHEC: Aucun PDF généré"
          echo "Vérifiez les logs de compilation dans les artefacts"
        fi
        
        # Summary for GitHub
        echo "## Résultat de Compilation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**PDFs générés:** $PDF_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "**Logs disponibles:** $LOG_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$PDF_COUNT" -gt 0 ]; then
          echo "**Status:** SUCCESS - PDFs générés avec succès" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fichiers générés:**" >> $GITHUB_STEP_SUMMARY
          find . -name "*.pdf" -type f | while read pdf; do
            size=$(stat -c%s "$pdf")
            echo "- \`$pdf\` (${size} bytes)" >> $GITHUB_STEP_SUMMARY
          done
        else
          echo "**Status:** FAILED - Aucun PDF généré" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Consultez les artefacts 'compilation-logs-debug' pour plus de détails." >> $GITHUB_STEP_SUMMARY
        fi
        