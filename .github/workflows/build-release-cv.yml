name: Build and Release CV

on:
  push:
    tags:
      - 'v*.*.*'      # Version tags (v1.0.0, v1.2.3, etc.)
      - 'release-*'   # Release tags (release-2025-08, etc.)

env:
  CV_FR_OUTPUT: CV-Samuel-SIKATI-KENMOGNE-Ingenieur-Logiciel-FR.pdf
  CV_EN_OUTPUT: CV-Samuel-SIKATI-KENMOGNE-Software-Engineer-EN.pdf

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout du code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Setup Python 
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    # Setup LaTeX
    - name: Setup LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra texlive-luatex

    # Verification des fichiers requis
    - name: Verify Required Files
      run: |
        echo "=== VERIFICATION DES FICHIERS REQUIS ==="
        
        # Liste des fichiers essentiels
        REQUIRED_FILES=("config.json" "build.py" "custom/fr/resume-fr.tex" "custom/en/resume-en.tex")
        MISSING_FILES=()
        
        # Verification de chaque fichier
        for file in "${REQUIRED_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "OK: $file existe ($(stat -c%s "$file") bytes)"
          else
            echo "ERREUR: $file manquant"
            MISSING_FILES+=("$file")
          fi
        done
        
        # Structure du repository
        echo "=== STRUCTURE DU REPOSITORY ==="
        find . -name "*.tex" -o -name "*.json" -o -name "*.py" -o -name "*.cls" | head -20
        
        # Verification du template awesome-cv
        if [ -f "awesome-cv.cls" ]; then
          echo "OK: Template awesome-cv.cls trouvé"
        elif [ -f "../../awesome-cv.cls" ]; then
          echo "OK: Template awesome-cv.cls trouvé dans le parent"
        else
          echo "ATTENTION: Template awesome-cv.cls non trouvé"
          echo "Les fichiers CV doivent utiliser un template disponible"
        fi
        
        # Verifier config.json
        if [ -f "config.json" ]; then
          echo "=== CONTENU CONFIG.JSON ==="
          cat config.json
          echo "=== FIN CONFIG.JSON ==="
        fi
        
        # Echec si des fichiers manquent
        if [ ${#MISSING_FILES[@]} -ne 0 ]; then
          echo "ECHEC: Fichiers manquants: ${MISSING_FILES[*]}"
          echo "Ajoutez ces fichiers à votre repository avant de créer une release"
          exit 1
        fi
        
        echo "SUCCESS: Tous les fichiers requis sont présents"

    # Test de compilation avec tolerance aux erreurs LaTeX
    - name: Build CVs with LaTeX Error Tolerance
      run: |
        echo "=== COMPILATION AVEC TOLERANCE AUX ERREURS ==="
        
        # Verifier que les scripts fonctionnent
        python build.py check || exit 1
        
        # Compiler SANS s'arreter sur les erreurs LaTeX
        set +e  # Desactiver l'arret sur erreur temporairement
        python build.py all
        BUILD_EXIT_CODE=$?
        set -e  # Reactiver l'arret sur erreur
        
        echo "Code de retour build.py: $BUILD_EXIT_CODE"
        
        # Verifier la generation de PDF independamment du code de retour
        echo "=== VERIFICATION GENERATION PDF ==="
        
        FR_PDFS=(custom/output/fr/*.pdf)
        EN_PDFS=(custom/output/en/*.pdf)
        
        # Compter les PDF generes (en excluant les glob patterns non matches)
        FR_COUNT=0
        EN_COUNT=0
        
        if [ -f "${FR_PDFS[0]}" ]; then
          FR_COUNT=${#FR_PDFS[@]}
          echo "PDF francais trouves ($FR_COUNT):"
          for pdf in "${FR_PDFS[@]}"; do
            size=$(stat -c%s "$pdf")
            echo "  $(basename "$pdf"): ${size} bytes"
          done
        else
          echo "Aucun PDF francais trouve"
        fi
        
        if [ -f "${EN_PDFS[0]}" ]; then
          EN_COUNT=${#EN_PDFS[@]}
          echo "PDF anglais trouves ($EN_COUNT):"
          for pdf in "${EN_PDFS[@]}"; do
            size=$(stat -c%s "$pdf")
            echo "  $(basename "$pdf"): ${size} bytes"
          done
        else
          echo "Aucun PDF anglais trouve"
        fi
        
        # Decision finale basee sur la presence de PDF, pas le code de retour
        if [ "$FR_COUNT" -gt 0 ] && [ "$EN_COUNT" -gt 0 ]; then
          echo "SUCCESS: PDF generes avec succes ($FR_COUNT FR, $EN_COUNT EN)"
          echo "Les avertissements LaTeX sont ignores car les PDF ont ete generes."
        else
          echo "ECHEC: Pas assez de PDF generes (FR: $FR_COUNT, EN: $EN_COUNT)"
          
          # Debug supplementaire
          echo "=== DEBUG: Contenu des repertoires ==="
          ls -la custom/output/fr/ || echo "Repertoire custom/output/fr/ vide"
          ls -la custom/output/en/ || echo "Repertoire custom/output/en/ vide"
          exit 1
        fi

    # Recuperer le nom du tag
    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    # Verification finale et preparation des assets
    - name: Prepare Release Assets
      run: |
        echo "=== PREPARATION DES ASSETS ==="
        
        # Créer le dossier final des assets
        mkdir -p release-assets
        
        # Copier les PDF avec vérification de l'existence
        FR_SOURCE=""
        EN_SOURCE=""
        
        # Chercher le CV français (plusieurs noms possibles)
        for fr_file in "custom/output/fr/${{ env.CV_FR_OUTPUT }}" "custom/output/fr/resume-fr.pdf"; do
          if [ -f "$fr_file" ]; then
            FR_SOURCE="$fr_file"
            break
          fi
        done
        
        # Chercher le CV anglais (plusieurs noms possibles)  
        for en_file in "custom/output/en/${{ env.CV_EN_OUTPUT }}" "custom/output/en/resume-en.pdf"; do
          if [ -f "$en_file" ]; then
            EN_SOURCE="$en_file"
            break
          fi
        done
        
        # Copier avec le bon nom
        if [ -n "$FR_SOURCE" ]; then
          cp "$FR_SOURCE" "release-assets/${{ env.CV_FR_OUTPUT }}"
          echo "✅ CV français préparé: $FR_SOURCE -> release-assets/${{ env.CV_FR_OUTPUT }}"
        else
          echo "❌ CV français non trouvé"
          ls -la custom/output/fr/
          exit 1
        fi
        
        if [ -n "$EN_SOURCE" ]; then
          cp "$EN_SOURCE" "release-assets/${{ env.CV_EN_OUTPUT }}"
          echo "✅ CV anglais préparé: $EN_SOURCE -> release-assets/${{ env.CV_EN_OUTPUT }}"
        else
          echo "❌ CV anglais non trouvé"
          ls -la custom/output/en/
          exit 1
        fi
        
        # Vérification finale
        echo "=== ASSETS FINALS ==="
        ls -la release-assets/
        
        FR_SIZE=$(stat -c%s "release-assets/${{ env.CV_FR_OUTPUT }}")
        EN_SIZE=$(stat -c%s "release-assets/${{ env.CV_EN_OUTPUT }}")
        
        echo "CV Français: ${{ env.CV_FR_OUTPUT }} (${FR_SIZE} bytes)"
        echo "CV Anglais: ${{ env.CV_EN_OUTPUT }} (${EN_SIZE} bytes)"

    # Creer la release directement avec les PDF generes
    - name: Create Release with Generated PDFs
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: CV Release ${{ steps.tag.outputs.tag }}
        body: |
          Nouvelle version du CV de Samuel SIKATI KENMOGNE
          
          Cette release contient les CV compilés en français et en anglais.
          
          **Fichiers inclus:**
          - CV-Samuel-SIKATI-KENMOGNE-Ingenieur-Logiciel-FR.pdf (Version française)
          - CV-Samuel-SIKATI-KENMOGNE-Software-Engineer-EN.pdf (Version anglaise)
          
          **Informations:**
          - Version: ${{ steps.tag.outputs.tag }}
          - Date: ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.sha }}
          - Compilateur: XeLaTeX (TeX Live 2023/Debian)
          
          **Note:** Cette version ignore les avertissements LaTeX non-critiques (Overfull hbox, icônes FontAwesome manquantes) qui n'affectent pas la qualité finale des PDF.
          
          ---
          *Généré automatiquement via GitHub Actions*
        files: |
          release-assets/${{ env.CV_FR_OUTPUT }}
          release-assets/${{ env.CV_EN_OUTPUT }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Resume final avec tailles de fichiers
    - name: Final Summary
      run: |
        echo "## ✅ Release créée avec succès" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        FR_SIZE=$(stat -c%s "release-assets/${{ env.CV_FR_OUTPUT }}")
        EN_SIZE=$(stat -c%s "release-assets/${{ env.CV_EN_OUTPUT }}")
        
        echo "**Fichiers publiés:**" >> $GITHUB_STEP_SUMMARY
        echo "- 🇫🇷 CV Français: \`${{ env.CV_FR_OUTPUT }}\` (${FR_SIZE} bytes)" >> $GITHUB_STEP_SUMMARY
        echo "- 🇬🇧 CV Anglais: \`${{ env.CV_EN_OUTPUT }}\` (${EN_SIZE} bytes)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY  
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 **Les CV sont maintenant disponibles dans les assets de la release!**"