name: Build and Release CV

on:
  push:
    tags:
      - 'v*.*.*'      # Version tags (v1.0.0, v1.2.3, etc.)
      - 'release-*'   # Release tags (release-2025-08, etc.)

env:
  CV_FR_OUTPUT: CV-Samuel-SIKATI-KENMOGNE-Ingenieur-Logiciel-FR.pdf
  CV_EN_OUTPUT: CV-Samuel-SIKATI-KENMOGNE-Software-Engineer-EN.pdf

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout du code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Setup Python (garde pour compatibilité si besoin)
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    # Setup LaTeX avec packages complets
    - name: Setup LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          texlive-latex-recommended \
          texlive-luatex \
          fonts-font-awesome \
          fontconfig \
          ghostscript \
          poppler-utils
      shell: bash

    # Verification des fichiers requis
    - name: Verify Required Files
      run: |
        echo "=== VERIFICATION DES FICHIERS REQUIS ==="
        
        # Check files individually (sh-compatible)
        if [ -f "custom/fr/resume-fr.tex" ]; then
          echo "OK: custom/fr/resume-fr.tex existe ($(stat -c%s "custom/fr/resume-fr.tex") bytes)"
        else
          echo "ERREUR: custom/fr/resume-fr.tex manquant"
          exit 1
        fi
        
        if [ -f "custom/en/resume-en.tex" ]; then
          echo "OK: custom/en/resume-en.tex existe ($(stat -c%s "custom/en/resume-en.tex") bytes)"
        else
          echo "ERREUR: custom/en/resume-en.tex manquant"
          exit 1
        fi
        
        if [ -f "awesome-cv.cls" ]; then
          echo "OK: awesome-cv.cls existe ($(stat -c%s "awesome-cv.cls") bytes)"
        else
          echo "ERREUR: awesome-cv.cls manquant"
          exit 1
        fi
        
        # Structure du repository
        echo "=== STRUCTURE REPOSITORY ==="
        find . -type f -name "*.tex" -o -name "*.cls" | sort | head -20
        
        echo "SUCCESS: Tous les fichiers requis sont presents"
      shell: bash

    # Preparation des repertoires de sortie
    - name: Prepare Output Directories
      run: |
        echo "=== PREPARATION REPERTOIRES SORTIE ==="
        mkdir -p custom/output/fr custom/output/en
        echo "Repertoires de sortie crees"
      shell: bash

    # Compilation directe CV Francais avec XeLaTeX
    - name: Compile French CV with XeLaTeX
      run: |
        echo "=== COMPILATION CV FRANCAIS AVEC XELATEX ==="
        cd custom/fr
        
        if [ -f "resume-fr.tex" ]; then
          echo "Compilation resume-fr.tex..."
          
          # First pass
          set +e
          xelatex \
            -interaction=nonstopmode \
            -file-line-error \
            -output-directory=../output/fr \
            resume-fr.tex > ../output/fr/compile1.out 2>&1
          first_exit=$?
          set -e
          
          if [ $first_exit -eq 0 ]; then
            # Second pass for cross-references
            xelatex \
              -interaction=nonstopmode \
              -file-line-error \
              -output-directory=../output/fr \
              resume-fr.tex > ../output/fr/compile2.out 2>&1
          fi
          
          if [ -f "../output/fr/resume-fr.pdf" ]; then
            size=$(stat -c%s "../output/fr/resume-fr.pdf")
            pages=$(pdfinfo "../output/fr/resume-fr.pdf" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
            
            echo "SUCCESS: CV francais genere"
            echo "  Taille: ${size} bytes"
            echo "  Pages: ${pages}"
            
            # Check for overfull warnings
            if [ -f "../output/fr/resume-fr.log" ]; then
              overfull_count=$(grep -c "Overfull" "../output/fr/resume-fr.log" || echo "0")
              echo "  Avertissements Overfull: $overfull_count"
            fi
          else
            echo "ERREUR: Echec generation CV francais"
            echo "Code de sortie: $first_exit"
            
            if [ -f "../output/fr/compile1.out" ]; then
              echo "=== ERREURS COMPILATION ==="
              grep -i "error\|emergency\|fatal" "../output/fr/compile1.out" | head -10
            fi
            exit 1
          fi
        else
          echo "ERREUR: resume-fr.tex non trouve"
          exit 1
        fi
      shell: bash

    # Compilation directe CV Anglais avec XeLaTeX
    - name: Compile English CV with XeLaTeX
      run: |
        echo "=== COMPILATION CV ANGLAIS AVEC XELATEX ==="
        cd custom/en
        
        if [ -f "resume-en.tex" ]; then
          echo "Compilation resume-en.tex..."
          
          # First pass
          set +e
          xelatex \
            -interaction=nonstopmode \
            -file-line-error \
            -output-directory=../output/en \
            resume-en.tex > ../output/en/compile1.out 2>&1
          first_exit=$?
          set -e
          
          if [ $first_exit -eq 0 ]; then
            # Second pass for cross-references
            xelatex \
              -interaction=nonstopmode \
              -file-line-error \
              -output-directory=../output/en \
              resume-en.tex > ../output/en/compile2.out 2>&1
          fi
          
          if [ -f "../output/en/resume-en.pdf" ]; then
            size=$(stat -c%s "../output/en/resume-en.pdf")
            pages=$(pdfinfo "../output/en/resume-en.pdf" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
            
            echo "SUCCESS: CV anglais genere"
            echo "  Taille: ${size} bytes"
            echo "  Pages: ${pages}"
            
            # Check for overfull warnings
            if [ -f "../output/en/resume-en.log" ]; then
              overfull_count=$(grep -c "Overfull" "../output/en/resume-en.log" || echo "0")
              echo "  Avertissements Overfull: $overfull_count"
            fi
          else
            echo "ERREUR: Echec generation CV anglais"
            echo "Code de sortie: $first_exit"
            
            if [ -f "../output/en/compile1.out" ]; then
              echo "=== ERREURS COMPILATION ==="
              grep -i "error\|emergency\|fatal" "../output/en/compile1.out" | head -10
            fi
            exit 1
          fi
        else
          echo "ERREUR: resume-en.tex non trouve"
          exit 1
        fi
      shell: bash

    # Verification finale des PDFs generes
    - name: Verify Generated PDFs
      run: |
        echo "=== VERIFICATION PDFS GENERES ==="
        
        FR_PDF="custom/output/fr/resume-fr.pdf"
        EN_PDF="custom/output/en/resume-en.pdf"
        
        if [ -f "$FR_PDF" ] && [ -f "$EN_PDF" ]; then
          FR_SIZE=$(stat -c%s "$FR_PDF")
          EN_SIZE=$(stat -c%s "$EN_PDF")
          FR_PAGES=$(pdfinfo "$FR_PDF" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
          EN_PAGES=$(pdfinfo "$EN_PDF" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
          
          echo "PDF francais: ${FR_SIZE} bytes, ${FR_PAGES} pages"
          echo "PDF anglais: ${EN_SIZE} bytes, ${EN_PAGES} pages"
          
          # Verify reasonable file sizes
          if [ "$FR_SIZE" -gt 10240 ] && [ "$EN_SIZE" -gt 10240 ]; then
            echo "SUCCESS: PDFs generes avec succes"
          else
            echo "ATTENTION: Tailles de fichier suspectes"
          fi
        else
          echo "ECHEC: PDFs manquants"
          echo "Contenu custom/output/fr/:"
          ls -la custom/output/fr/ || echo "Vide"
          echo "Contenu custom/output/en/:"
          ls -la custom/output/en/ || echo "Vide"
          exit 1
        fi
      shell: bash

    # Upload des logs de debug
    - name: Upload Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xelatex-compilation-logs
        path: |
          custom/output/**/*.log
          custom/output/**/*.out
          custom/**/*.backup
          awesome-cv.cls.original
          awesome-cv.cls
        retention-days: 7

    # Recuperer le nom du tag
    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      shell: bash

    # Preparation des assets pour la release
    - name: Prepare Release Assets
      run: |
        echo "=== PREPARATION DES ASSETS ==="
        
        # Creer le dossier final des assets
        mkdir -p release-assets
        
        # Sources des PDFs
        FR_SOURCE="custom/output/fr/resume-fr.pdf"
        EN_SOURCE="custom/output/en/resume-en.pdf"
        
        if [ -f "$FR_SOURCE" ] && [ -f "$EN_SOURCE" ]; then
          # Copier avec les noms finaux
          cp "$FR_SOURCE" "release-assets/${{ env.CV_FR_OUTPUT }}"
          cp "$EN_SOURCE" "release-assets/${{ env.CV_EN_OUTPUT }}"
          
          FR_SIZE=$(stat -c%s "release-assets/${{ env.CV_FR_OUTPUT }}")
          EN_SIZE=$(stat -c%s "release-assets/${{ env.CV_EN_OUTPUT }}")
          
          echo "CV francais prepare: ${FR_SIZE} bytes"
          echo "CV anglais prepare: ${EN_SIZE} bytes"
          
          # Verification integrite PDF
          if pdfinfo "release-assets/${{ env.CV_FR_OUTPUT }}" > /dev/null 2>&1; then
            echo "PDF francais valide"
          else
            echo "ATTENTION: PDF francais potentiellement corrompu"
          fi
          
          if pdfinfo "release-assets/${{ env.CV_EN_OUTPUT }}" > /dev/null 2>&1; then
            echo "PDF anglais valide"
          else
            echo "ATTENTION: PDF anglais potentiellement corrompu"
          fi
        else
          echo "ERREUR: PDFs sources manquants"
          echo "FR_SOURCE: $FR_SOURCE"
          echo "EN_SOURCE: $EN_SOURCE"
          exit 1
        fi
      shell: bash

    # Creer la release
    - name: Create Release with Generated PDFs
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: CV Release ${{ steps.tag.outputs.tag }}
        body: |
          **Nouvelle version du CV de Samuel SIKATI KENMOGNE**
          
          Cette release contient les CV compiles directement avec XeLaTeX.
          
          **Fichiers inclus:**
          - CV-Samuel-SIKATI-KENMOGNE-Ingenieur-Logiciel-FR.pdf (Version francaise)
          - CV-Samuel-SIKATI-KENMOGNE-Software-Engineer-EN.pdf (Version anglaise)
          
          **Informations techniques:**
          - Version: ${{ steps.tag.outputs.tag }}
          - Date: ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.sha }}
          - Compilateur: XeLaTeX direct (TeX Live 2025/Debian)
          - Template: posquit0/Awesome-CV avec corrections
          
          **Corrections appliquees:**
          - Compilation directe XeLaTeX (sans scripts Python)
          - Correction erreurs awesome-cv.cls (@fontdir, syntaxe)
          - Reecriture skills.tex pour eliminer overfull hbox
          - Controle strict espacement et pagination
          - Verification integrite PDFs
          
          ---
          *Genere automatiquement via GitHub Actions - XeLaTeX direct*
        files: |
          release-assets/${{ env.CV_FR_OUTPUT }}
          release-assets/${{ env.CV_EN_OUTPUT }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Resume final avec details
    - name: Final Summary
      run: |
        echo "## Release creee avec succes (XeLaTeX direct)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        FR_SIZE=$(stat -c%s "release-assets/${{ env.CV_FR_OUTPUT }}")
        EN_SIZE=$(stat -c%s "release-assets/${{ env.CV_EN_OUTPUT }}")
        FR_PAGES=$(pdfinfo "release-assets/${{ env.CV_FR_OUTPUT }}" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
        EN_PAGES=$(pdfinfo "release-assets/${{ env.CV_EN_OUTPUT }}" 2>/dev/null | grep "Pages:" | awk '{print $2}' || echo "?")
        
        echo "**Fichiers publies:**" >> $GITHUB_STEP_SUMMARY
        echo "- CV Francais: \`${{ env.CV_FR_OUTPUT }}\` (${FR_SIZE} bytes, ${FR_PAGES} pages)" >> $GITHUB_STEP_SUMMARY
        echo "- CV Anglais: \`${{ env.CV_EN_OUTPUT }}\` (${EN_SIZE} bytes, ${EN_PAGES} pages)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Methode de compilation:**" >> $GITHUB_STEP_SUMMARY
        echo "- XeLaTeX direct (sans scripts Python)" >> $GITHUB_STEP_SUMMARY
        echo "- Corrections automatiques appliquees" >> $GITHUB_STEP_SUMMARY
        echo "- Controle strict des espaces" >> $GITHUB_STEP_SUMMARY
        echo "- Verification integrite PDFs" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
      shell: bash